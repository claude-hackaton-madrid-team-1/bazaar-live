name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (oxlint + eslint)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke-test the server (static page, a game route + /health, no TTS or game keys)
        run: |
          PORT=8080 node server/index.ts &
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 0.5; done
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -fsS localhost:8080/api/tts/providers)" = '{"providers":[]}'
          test "$(curl -fsS localhost:8080/api/game)" = '{"enabled":false,"target":null,"tokenRequired":false}'
          curl -fsS localhost:8080/agent | grep -q '<div id="root">'
