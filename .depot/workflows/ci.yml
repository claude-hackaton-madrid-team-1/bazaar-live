name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: localtest
        ports:
          - 127.0.0.1:55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Formatter
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        env:
          SHOW_TEST_ADMIN_URL: postgresql://postgres:localtest@127.0.0.1:55433/postgres
        run: npm run test:integration
